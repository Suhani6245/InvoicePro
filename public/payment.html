<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pay Invoice - InvoicePro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-primary:#2c3e88; --color-primary-dark:#1f2c63; --color-accent:#17968f;
    --color-success:#1a9c4a; --color-success-bg:#e7f7ec; --color-danger:#c0392b; --color-danger-bg:#fbeae7;
    --color-warning:#c98a12; --color-warning-bg:#fdf3e0; --color-info:#2c6fbb; --color-info-bg:#e8f1fb;
    --color-border:#e3e7f0; --color-text:#1a1e2e; --color-text-muted:#666f8a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--color-text);
    background:radial-gradient(circle at 20% 20%, #33468f, var(--color-primary-dark) 65%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,h2,h3{font-family:'Sora',sans-serif; margin:0 0 4px; font-weight:700;}
  .card{width:100%; max-width:420px; background:#fff; border-radius:16px; box-shadow:0 12px 32px rgba(20,24,43,0.25); padding:30px 28px;}
  .brand{display:flex; align-items:center; gap:9px; margin-bottom:20px;}
  .brand-mark{width:32px;height:32px;border-radius:8px;background:var(--color-accent);color:#06201f;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;}
  .brand-name{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;}
  .row{display:flex; justify-content:space-between; padding:8px 0; font-size:13.5px; border-bottom:1px solid var(--color-border);}
  .row:last-child{border-bottom:none;}
  .row .label{color:var(--color-text-muted);}
  .amount-due{text-align:center; margin:20px 0;}
  .amount-due .label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--color-text-muted); font-weight:600;}
  .amount-due .value{font-family:'Sora',sans-serif; font-size:34px; font-weight:700; color:var(--color-primary); margin-top:4px;}
  .badge{display:inline-flex; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
  .badge-Paid{background:var(--color-success-bg); color:var(--color-success);}
  .badge-Pending{background:var(--color-warning-bg); color:var(--color-warning);}
  .badge-Partial{background:var(--color-info-bg); color:var(--color-info);}
  .badge-Overdue{background:var(--color-danger-bg); color:var(--color-danger);}
  button{
    width:100%; padding:13px; border:none; border-radius:9px; background:var(--color-accent); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer; margin-top:18px; font-family:inherit;
  }
  button:hover{filter:brightness(0.93);}
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{padding:10px 12px; border-radius:8px; font-size:12.5px; margin-top:14px;}
  .msg.error{background:var(--color-danger-bg); color:var(--color-danger);}
  .msg.success{background:var(--color-success-bg); color:var(--color-success);}
  .center{text-align:center; padding:30px 10px; color:var(--color-text-muted);}
  .receipt-icon{font-size:40px; text-align:center; margin-bottom:8px;}
  .footnote{text-align:center; font-size:11px; color:var(--color-text-muted); margin-top:16px;}
</style>
</head>
<body>
  <div class="card" id="paymentCard">
    <div class="brand">
      <div class="brand-mark">IP</div>
      <div class="brand-name">InvoicePro</div>
    </div>
    <div id="content" class="center">Loading invoice...</div>
  </div>

<script>
const invoiceNumber = window.location.pathname.split('/').pop();
const contentEl = document.getElementById('content');

const money = (n) => 'Rs. ' + Number(n || 0).toFixed(2);

async function loadInvoice() {
  try {
    const res = await fetch(`/api/invoices/pay/${encodeURIComponent(invoiceNumber)}`);
    const json = await res.json();
    if (!res.ok || !json.success) {
      contentEl.innerHTML = `<div class="msg error">${json.message || 'Invoice not found'}</div>`;
      return;
    }
    renderInvoice(json.data);
  } catch (err) {
    contentEl.innerHTML = `<div class="msg error">Could not load invoice. Please check the link and try again.</div>`;
  }
}

function renderInvoice(inv) {
  const alreadyPaid = inv.remainingAmount <= 0;
  contentEl.innerHTML = `
    <h2>Invoice ${inv.invoiceNumber}</h2>
    <p style="color:var(--color-text-muted); font-size:13px; margin-bottom:14px;">${inv.customerName || ''}</p>
    <div class="row"><span class="label">Invoice Date</span><span>${new Date(inv.invoiceDate).toLocaleDateString()}</span></div>
    <div class="row"><span class="label">Due Date</span><span>${new Date(inv.dueDate).toLocaleDateString()}</span></div>
    <div class="row"><span class="label">Grand Total</span><span>${money(inv.grandTotal)}</span></div>
    <div class="row"><span class="label">Already Paid</span><span>${money(inv.paidAmount)}</span></div>
    <div class="row"><span class="label">Status</span><span class="badge badge-${inv.status}">${inv.status}</span></div>
    <div class="amount-due">
      <div class="label">Amount Due</div>
      <div class="value">${money(inv.remainingAmount)}</div>
    </div>
    ${alreadyPaid
      ? `<div class="msg success">This invoice has already been paid in full. Thank you!</div>`
      : `<button id="payBtn">Pay Now</button>`
    }
    <div class="footnote">Simulated payment for demo purposes - no real transaction occurs.</div>
  `;

  const payBtn = document.getElementById('payBtn');
  if (payBtn) payBtn.addEventListener('click', payNow);
}

async function payNow() {
  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.textContent = 'Processing...';
  try {
    const res = await fetch(`/api/invoices/pay/${encodeURIComponent(invoiceNumber)}`, { method: 'POST' });
    const json = await res.json();
    if (!res.ok || !json.success) {
      contentEl.insertAdjacentHTML('beforeend', `<div class="msg error">${json.message || 'Payment failed'}</div>`);
      btn.disabled = false;
      btn.textContent = 'Pay Now';
      return;
    }
    renderReceipt(json.data.receipt);
  } catch (err) {
    contentEl.insertAdjacentHTML('beforeend', `<div class="msg error">Payment failed. Please try again.</div>`);
    btn.disabled = false;
    btn.textContent = 'Pay Now';
  }
}

function renderReceipt(receipt) {
  contentEl.innerHTML = `
    <div class="receipt-icon">✅</div>
    <h2 style="text-align:center;">Payment Successful</h2>
    <p style="text-align:center; color:var(--color-text-muted); font-size:13px; margin-bottom:14px;">Receipt for invoice ${receipt.invoiceNumber}</p>
    <div class="row"><span class="label">Amount Paid</span><span>${money(receipt.amountPaid)}</span></div>
    <div class="row"><span class="label">Transaction ID</span><span>${receipt.transactionId}</span></div>
    <div class="row"><span class="label">Date</span><span>${new Date(receipt.date).toLocaleString()}</span></div>
    <div class="row"><span class="label">Status</span><span class="badge badge-${receipt.status}">${receipt.status}</span></div>
    <div class="msg success" style="margin-top:16px;">Thank you! This invoice is now marked as ${receipt.status.toLowerCase()}.</div>
  `;
}

loadInvoice();
</script>
</body>
</html>
